name: pr-validation

# Runs the suite against incoming pull requests, including those from forks, and
# reports the result back on the PR so reviewers do not have to open the run.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Write run summary
        run: |
          echo "### pr-validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Title: ${{ github.event.pull_request.title }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: ${{ github.event.pull_request.head.ref }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'pr-validation passed for `${{ github.event.pull_request.head.ref }}`',
            })
