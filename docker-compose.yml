name: convo-hub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: convo_hub
      POSTGRES_USER: convo_hub
      POSTGRES_PASSWORD: convo_hub_local
    ports:
      - '5432:5432'
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - convo-hub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U convo_hub -d convo_hub']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  convo-hub-pgdata:
